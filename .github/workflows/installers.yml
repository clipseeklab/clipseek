name: Build installers
run-name: macOS installers · ${{ github.ref_name }}

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  validate:
    name: Validate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Validate version and select native runners
        id: plan
        run: node scripts/ci/build-plan.mjs
      - name: Install the pinned formatter
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup override set 1.99.0
      - run: npm ci
      - run: npm run quality:check
      - run: npm test
      - run: npm run build

  build:
    name: Package ${{ matrix.id }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_ID: ${{ matrix.id }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify native runner architecture
        run: node -e "if(process.platform!==process.env.BUILD_PLATFORM||process.arch!==process.env.BUILD_ARCH)throw Error('Runner architecture mismatch')"
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          rustup target add "$BUILD_TARGET"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-1.99.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            runtime
            .cache
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/build-media.mjs', 'scripts/prepare-runtime.mjs') }}
      - run: npm ci
      - name: Install macOS media build dependencies
        run: brew list pkgconf > /dev/null 2>&1 || brew install pkgconf
      - name: Prepare macOS media and inference runtimes
        run: npm run runtime:prepare
      - run: node scripts/ci/verify-runtime.mjs
      - name: Run native desktop E2E
        run: npm run test:e2e
      - name: Remove installers left in the dependency cache
        run: node -e "require('node:fs').rmSync(require('node:path').join('src-tauri','target',process.env.BUILD_TARGET,'release','bundle'),{recursive:true,force:true})"
      - name: Build macOS installer
        run: npx tauri build --ci --target "$BUILD_TARGET" --bundles dmg -- --locked
      - name: Collect only the installer and checksum
        run: node scripts/ci/collect-installers.mjs
      - name: Upload test installers
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: installers-${{ matrix.id }}-${{ needs.validate.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Prepare release draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true
      - name: Verify every installer and update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publish-release.mjs
